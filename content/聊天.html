<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>聊天 - ~%?,·;'$?</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-input: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #c0c0c0;
            --text-timestamp: #666;
            --border-color: #2a2a2a;
            --border-light: #1e1e1e;
            --accent-red: #4a1a1a;
            --accent-red-line: #6b2a2a;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.5s;
        }

        /* 全屏黑色覆盖层（结局） */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .blackout-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .investigation-text {
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
            padding: 20px;
        }
        .investigation-text.show {
            opacity: 1;
        }

        /* 好友申请弹窗 */
        .friend-request-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 900;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .friend-request-dialog {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 28px 24px;
            max-width: 320px;
            width: 90%;
            color: #ccc;
            font-family: var(--font-sans);
            text-align: center;
            pointer-events: auto;
        }
        .friend-request-dialog .title {
            font-size: 16px;
            margin-bottom: 16px;
            color: #ddd;
            letter-spacing: 1px;
        }
        .friend-request-dialog .user-id {
            font-size: 18px;
            color: #e0e0e0;
            letter-spacing: 2px;
            margin-bottom: 24px;
            word-break: break-all;
            animation: textGlitch 2.5s infinite;
        }
        @keyframes textGlitch {
            0%,
            100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-1px, 1px);
            }
            40% {
                transform: translate(1px, -1px);
            }
            60% {
                transform: translate(-1px, -1px);
            }
            80% {
                transform: translate(1px, 1px);
            }
        }
        .avatar-icon {
            width: 48px;
            height: 48px;
            background: #111;
            border: 1px solid #333;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #aaa;
            animation: subtleShake 3s infinite;
        }
        @keyframes subtleShake {
            0%,
            100% {
                transform: rotate(0);
            }
            25% {
                transform: rotate(0.5deg);
            }
            75% {
                transform: rotate(-0.5deg);
            }
        }
        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 24px;
        }
        .friend-btn {
            padding: 10px 28px;
            border: 1px solid #444;
            background: #111;
            color: #ccc;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            font-family: var(--font-sans);
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .friend-btn.reject {
            border-color: #3a3a3a;
            color: #999;
        }
        .friend-btn.reject:active {
            background: #222;
            border-color: #555;
        }
        .friend-btn.accept {
            border-color: #555;
        }
        .friend-btn.accept:active {
            background: #1a1a1a;
            border-color: #777;
        }

        /* 聊天窗口 */
        .chat-window {
            width: 100%;
            max-width: 520px;
            height: 85vh;
            max-height: 700px;
            min-height: 480px;
            background: var(--bg-primary);
            border-radius: 4px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
            transition: opacity 0.8s;
        }

        .chat-header {
            background: #111;
            border-bottom: 1px solid var(--border-light);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-height: 50px;
            position: relative;
            z-index: 3;
        }
        .chat-header .avatar {
            width: 34px;
            height: 34px;
            background: #111;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 16px;
            flex-shrink: 0;
            animation: subtleShake 4s infinite;
        }
        .header-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .contact-name {
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
            letter-spacing: 0.5px;
        }
        .contact-status {
            font-size: 11px;
            color: #888;
            transition: color 0.3s;
        }
        .contact-status.online {
            color: #5b8c5a;
        }
        .contact-status.typing {
            color: #6b8fb5;
            animation: subtlePulse 1.6s infinite;
        }
        @keyframes subtlePulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .residual-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent-red-line);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 4;
            pointer-events: none;
        }
        .residual-line.visible {
            opacity: 1;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-primary);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            transition: padding-top 0.4s ease;
        }
        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            animation: fadeInMsg 0.3s ease-out;
        }
        @keyframes fadeInMsg {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-meta {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 2px;
        }
        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.3px;
        }
        .message-sender.is-self {
            color: #ccc;
        }
        .message-time {
            font-size: 10px;
            color: var(--text-timestamp);
        }
        .message-body {
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--text-primary);
            word-break: break-word;
            white-space: pre-wrap;
            letter-spacing: 0.3px;
        }
        /* 对方消息红色 */
        .message-body.stranger-text {
            color: #cc3333;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
            align-self: flex-start;
            margin-top: 2px;
        }
        .typing-indicator-text {
            font-size: 11px;
            color: #888;
            margin-right: 4px;
        }
        .typing-dots {
            display: flex;
            gap: 3px;
        }
        .typing-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #888;
            animation: dotBounce 1.4s infinite;
        }
        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.18s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 0.36s;
        }
        @keyframes dotBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-7px);
                opacity: 1;
            }
        }

        .chat-input-area {
            border-top: 1px solid var(--border-light);
            padding: 10px 14px 12px;
            padding-bottom: calc(12px + var(--safe-bottom));
            background: var(--bg-primary);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 3;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .chat-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 3px;
            font-size: 14px;
            font-family: var(--font-sans);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            caret-color: #ccc;
            line-height: 1.5;
            -webkit-appearance: none;
            transition: border-color 0.15s;
        }
        .chat-input:focus {
            border-color: #555;
            background: #222;
        }
        .chat-input:disabled {
            background: #1a1a1a;
            color: #666;
            border-color: #222;
            caret-color: transparent;
        }
        .chat-input::placeholder {
            color: #555;
            font-size: 13px;
        }

        .send-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #888;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
            outline: none;
        }
        .send-btn:active {
            background: #1a1a1a;
        }

        /* 风险警告条 - 初始在左侧屏幕外 */
        .risk-banner {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            background: #3a1a1a;
            color: #ffb0b0;
            font-size: 12px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            transform: translateX(-100%);
            transition: transform 0.4s ease, opacity 0.3s;
        }
        .risk-banner.slide-in {
            transform: translateX(0);
        }
        .risk-banner.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-100%);
        }
        .risk-close {
            cursor: pointer;
            font-size: 16px;
            color: #cc8888;
            background: none;
            border: none;
            margin-left: 12px;
        }

        @media (max-width: 560px) {
            body {
                padding: 0;
                align-items: stretch;
                background: #000;
            }
            .chat-window {
                max-width: 100%;
                height: 100vh;
                height: -webkit-fill-available;
                max-height: none;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
            .chat-input {
                font-size: 16px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

    <!-- 黑屏覆盖层（结局） -->
    <div class="blackout-overlay" id="blackoutOverlay">
        <div class="investigation-text" id="investigationText">▮▮城区发生平民异常死亡事件，已指派特工进行现场调查</div>
    </div>

    <!-- 好友申请弹窗 -->
    <div class="friend-request-overlay" id="friendRequestOverlay">
        <div class="friend-request-dialog">
            <div class="avatar-icon">?</div>
            <div class="title">新的好友申请</div>
            <div class="user-id">~%?,·;'$?</div>
            <div class="button-group">
                <button class="friend-btn reject" id="btnReject">拒绝</button>
                <button class="friend-btn accept" id="btnAccept">同意</button>
            </div>
        </div>
    </div>

    <!-- 聊天窗口 -->
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="avatar">?</div>
            <div class="header-info">
                <span class="contact-name">~%?,·;'$?</span>
                <span class="contact-status online" id="headerStatus">在线</span>
            </div>
            <div class="residual-line" id="residualLine"></div>
        </div>
        <div class="risk-banner" id="riskBanner">
            <span>⚠ 此账号存在风险</span>
            <button class="risk-close" id="riskCloseBtn">×</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" class="chat-input" id="chatInput" placeholder="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
            </div>
            <button class="send-btn" id="sendBtn" title="发送">➤</button>
        </div>
    </div>

    <script>
        (function() {
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const headerStatus = document.getElementById('headerStatus');
            const riskBanner = document.getElementById('riskBanner');
            const riskCloseBtn = document.getElementById('riskCloseBtn');
            const residualLine = document.getElementById('residualLine');
            const friendOverlay = document.getElementById('friendRequestOverlay');
            const btnReject = document.getElementById('btnReject');
            const btnAccept = document.getElementById('btnAccept');
            const blackoutOverlay = document.getElementById('blackoutOverlay');
            const investigationText = document.getElementById('investigationText');
            const chatWindow = document.getElementById('chatWindow');

            // 对话脚本 (严格按照用户提供顺序)
            const dialogueScript = [
                { sender: 'A', text: '你好。', typing: 800 },
                { sender: 'B', preset: '你是谁？' },
                { sender: 'A', text: '现在不是解释这个的时候。你现在处在危险中。', typing: 2000 },
                { sender: 'B', preset: '？莫名其妙？' },
                { sender: 'A', text: '你可以把望望窗外。不过别把头伸出去。你看到了吗。那有一个人影。', typing: 2400 },
                { sender: 'B', preset: '。。。怎么回事？' },
                { sender: 'A', text: '你现在要先相信我。这一切都是因为你昨天看了那份文件导致的。你的同事警告过你不要翻阅了。现在。你需要按我说的做。', typing: 2800 },
                { sender: 'B', preset: '好' },
                { sender: 'A', text: '把你卧室的门锁上。然后。关灯。就留电脑屏幕的光。', typing: 2200 },
                { sender: 'B', preset: '我照做了' },
                { sender: 'A', text: '嗯。现在它发现你会增加一些困难了。', typing: 1800 },
                { sender: 'B', preset: '我这里有声音，什么东西在我身后' },
                { sender: 'A', text: '呼吸声吗。', typing: 1200 },
                { sender: 'B', preset: '是的！我该怎么办？' },
                { sender: 'A', text: '不要动。就看着屏幕。', typing: 1400 },
                { sender: 'B', preset: '好。。。', afterSendDelay: 3000 },
                { sender: 'A', text: '它走了吗。', typing: 1000 },
                { sender: 'B', preset: '不见了' },
                { sender: 'A', text: '打开窗户。', typing: 900 },
                { sender: 'B', preset: '为什么？？', afterSendDelay: 2000 },
                { sender: 'A', text: '不要问了。！？··-》；·马上·@~￥！你想死吗', typing: 2000 },
                { sender: 'B', preset: '可是' },
                { sender: 'A', text: '快点……！%&！%#相信我。', typing: 1800 },
                { sender: 'B', preset: '我开了' },
                { sender: 'A', text: '！@%##！%', typing: 1000, afterDeliverDelay: 2000 },
                { sender: 'A', text: '现在你可以回头了。。！@！&@', typing: 2000, isFinal: true },
            ];

            let currentIndex = 0;
            let currentPreset = '';
            let charIndex = 0;
            let isWaitingForReply = false;
            let isFinished = false;
            let typingIndicator = null;
            let currentTime = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate(), 23, 12,
            0);
            let inputLocked = false;
            let pendingDelayTimer = null;

            function init() {
                // 初始纯黑屏，3秒后显示好友申请
                setTimeout(() => {
                    friendOverlay.style.display = 'flex';
                }, 3000);

                btnReject.addEventListener('click', (e) => {
                    e.preventDefault();
                    btnReject.style.background = '#222';
                    setTimeout(() => { btnReject.style.background = ''; }, 150);
                });

                btnAccept.addEventListener('click', () => {
                    friendOverlay.style.display = 'none';
                    startChat();
                });

                sendBtn.addEventListener('click', () => {
                    if (isFinished || isWaitingForReply || inputLocked) return;
                    if (currentPreset && charIndex < currentPreset.length) {
                        charIndex++;
                        updateInputValue();
                    } else if (currentPreset && charIndex >= currentPreset.length) {
                        sendUserMessage();
                    }
                });

                chatInput.addEventListener('keydown', handleKeyDown);
                chatInput.addEventListener('input', handleInput);
                chatInput.addEventListener('paste', (e) => e.preventDefault());
                chatInput.addEventListener('drop', (e) => e.preventDefault());
                chatInput.addEventListener('blur', () => {
                    if (!isWaitingForReply && !isFinished && !inputLocked && charIndex < currentPreset.length) {
                        setTimeout(() => { if (document.activeElement !== chatInput) chatInput.focus(); }, 200);
                    }
                });

                riskCloseBtn.addEventListener('click', () => {
                    riskBanner.classList.add('hidden');
                    riskBanner.classList.remove('slide-in');
                    residualLine.classList.add('visible');
                    chatMessages.style.paddingTop = '16px';
                });
            }

            function startChat() {
                chatWindow.style.display = 'flex';
                // 0.5秒后警告从左向右滑出
                setTimeout(() => {
                    riskBanner.classList.add('slide-in');
                    chatMessages.style.paddingTop = '52px';
                }, 500);
                // 再1秒后（总共1.5秒后）对方发送第一条消息
                setTimeout(() => {
                    loadRound(0);
                    chatInput.focus();
                }, 1500);
            }

            function loadRound(index) {
                if (index >= dialogueScript.length) {
                    finishChat();
                    return;
                }
                currentIndex = index;
                const item = dialogueScript[index];
                isWaitingForReply = false;
                inputLocked = false;

                if (item.sender === 'B') {
                    currentPreset = item.preset;
                    charIndex = 0;
                    chatInput.value = '';
                    chatInput.disabled = false;
                    chatInput.placeholder = '';
                    chatInput.focus();
                    updateHeaderStatus('online');
                } else {
                    currentPreset = '';
                    charIndex = 0;
                    chatInput.disabled = true;
                    chatInput.placeholder = '';

                    const typingDuration = item.typing || 1500;
                    showTypingIndicator();
                    updateHeaderStatus('typing');

                    setTimeout(() => {
                        if (isFinished) return;
                        removeTypingIndicator();
                        deliverMessage(item);
                    }, typingDuration);
                }
            }

            function handleKeyDown(e) {
                if (isFinished || isWaitingForReply || inputLocked) {
                    e.preventDefault();
                    return;
                }
                const key = e.key;
                const modifierKeys = ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'NumLock', 'ScrollLock', 'Pause',
                    'ContextMenu', 'Fn', 'Hyper', 'Super', 'OS', 'Symbol', 'Unidentified'
                ];
                if (modifierKeys.includes(key) || key.startsWith('Dead')) return;

                if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Tab'].includes(key)) {
                    e.preventDefault();
                    return;
                }
                if (key === 'Backspace' || key === 'Delete') {
                    e.preventDefault();
                    return;
                }
                if (key === 'Enter') {
                    e.preventDefault();
                    if (currentPreset && charIndex >= currentPreset.length) {
                        sendUserMessage();
                    }
                    return;
                }
                if (key.length === 1) {
                    e.preventDefault();
                    if (currentPreset && charIndex < currentPreset.length) {
                        charIndex++;
                        updateInputValue();
                    } else if (currentPreset && charIndex >= currentPreset.length) {
                        sendUserMessage();
                    }
                } else {
                    e.preventDefault();
                }
            }

            function handleInput() {
                if (isWaitingForReply || isFinished || inputLocked) {
                    chatInput.value = '';
                    return;
                }
                const expected = currentPreset ? currentPreset.substring(0, charIndex) : '';
                if (chatInput.value !== expected) {
                    chatInput.value = expected;
                    chatInput.setSelectionRange(expected.length, expected.length);
                }
            }

            function updateInputValue() {
                const val = currentPreset.substring(0, charIndex);
                chatInput.value = val;
                chatInput.setSelectionRange(val.length, val.length);
            }

            function sendUserMessage() {
                if (isWaitingForReply || isFinished || inputLocked) return;
                if (!currentPreset || charIndex < currentPreset.length) return;
                const text = chatInput.value.trim();
                if (!text) return;

                const timeStr = formatTime(currentTime);
                addMessage('我', text, timeStr, true);
                advanceTime(1);

                chatInput.value = '';
                chatInput.disabled = true;
                chatInput.placeholder = '';
                charIndex = 0;
                currentPreset = '';
                isWaitingForReply = true;
                scrollToBottom();

                const item = dialogueScript[currentIndex];
                const delay = item.afterSendDelay || 0;

                if (delay > 0) {
                    inputLocked = true;
                    pendingDelayTimer = setTimeout(() => {
                        inputLocked = false;
                        pendingDelayTimer = null;
                        goToNextRound();
                    }, delay);
                } else {
                    goToNextRound();
                }
            }

            function goToNextRound() {
                const nextIndex = currentIndex + 1;
                if (nextIndex < dialogueScript.length) {
                    loadRound(nextIndex);
                } else {
                    finishChat();
                }
            }

            function deliverMessage(item) {
                const timeStr = formatTime(currentTime);
                addMessage('~%?,·;\'$?', item.text, timeStr, false);
                advanceTime(1);
                scrollToBottom();

                if (item.isFinal) {
                    setTimeout(() => finishChat(), 1500);
                } else if (item.afterDeliverDelay) {
                    pendingDelayTimer = setTimeout(() => {
                        pendingDelayTimer = null;
                        goToNextRound();
                    }, item.afterDeliverDelay);
                } else {
                    goToNextRound();
                }
            }

            function showTypingIndicator() {
                removeTypingIndicator();
                const div = document.createElement('div');
                div.className = 'typing-indicator';
                div.id = 'typingIndicator';
                div.innerHTML =
                    '<span class="typing-indicator-text">对方正在输入</span><span class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>';
                chatMessages.appendChild(div);
                typingIndicator = div;
                scrollToBottom();
            }

            function removeTypingIndicator() {
                if (typingIndicator && typingIndicator.parentNode) typingIndicator.remove();
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
                typingIndicator = null;
            }

            function addMessage(sender, text, timeStr, isSelf) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';
                const meta = document.createElement('div');
                meta.className = 'message-meta';
                const senderSpan = document.createElement('span');
                senderSpan.className = 'message-sender ' + (isSelf ? 'is-self' : 'is-stranger');
                senderSpan.textContent = sender;
                const timeSpan = document.createElement('span');
                timeSpan.className = 'message-time';
                timeSpan.textContent = timeStr;
                meta.appendChild(senderSpan);
                meta.appendChild(timeSpan);
                const body = document.createElement('div');
                body.className = 'message-body';
                if (!isSelf) {
                    body.classList.add('stranger-text');
                }
                body.textContent = text;
                body.style.whiteSpace = 'pre-wrap';
                wrapper.appendChild(meta);
                wrapper.appendChild(body);
                chatMessages.appendChild(wrapper);
            }

            function finishChat() {
                if (isFinished) return;
                isFinished = true;
                isWaitingForReply = false;
                removeTypingIndicator();
                if (pendingDelayTimer) {
                    clearTimeout(pendingDelayTimer);
                    pendingDelayTimer = null;
                }
                chatInput.disabled = true;
                chatInput.value = '';
                chatInput.placeholder = '';
                updateHeaderStatus('offline');

                chatWindow.style.opacity = '0';
                setTimeout(() => {
                    chatWindow.style.display = 'none';
                    blackoutOverlay.classList.add('active');
                    setTimeout(() => {
                        investigationText.classList.add('show');
                    }, 3000);
                }, 800);
            }

            function updateHeaderStatus(status) {
                headerStatus.classList.remove('online', 'typing');
                if (status === 'online') {
                    headerStatus.classList.add('online');
                    headerStatus.textContent = '在线';
                } else if (status === 'typing') {
                    headerStatus.classList.add('typing');
                    headerStatus.textContent = '正在输入...';
                } else if (status === 'offline') {
                    headerStatus.textContent = '离线';
                    headerStatus.style.color = '#777';
                }
            }

            function formatTime(date) {
                const h = String(date.getHours()).padStart(2, '0');
                const m = String(date.getMinutes()).padStart(2, '0');
                return `${h}:${m}`;
            }

            function advanceTime(minutes) {
                currentTime = new Date(currentTime.getTime() + minutes * 60000);
            }

            function scrollToBottom() {
                requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
                setTimeout(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 100);
            }

            init();
        })();
    </script>
</body>
</html>
